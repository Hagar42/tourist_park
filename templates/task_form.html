{% extends "base.html" %}
{% block title %}{{ "Edit Task" if task else "New Task" }} - Park Maintenance{% endblock %}

{% block content %}
<h1>{{ "Edit Task" if task else "New Task" }}</h1>

<form method="post" class="form">
    <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" required value="{{ task.title if task else '' }}">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3">{{ task.description if task and task.description else '' }}</textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
                {% for c in ['plumbing', 'electrical', 'grounds', 'cleaning', 'structural', 'equipment', 'safety', 'other'] %}
                <option value="{{ c }}" {% if task and task.category == c %}selected{% endif %}>{{ c | title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="priority">Priority *</label>
            <select id="priority" name="priority" required>
                {% for p in ['low', 'medium', 'high', 'urgent'] %}
                <option value="{{ p }}" {% if task and task.priority == p %}selected{% endif %}>{{ p | title }}</option>
                {% endfor %}
            </select>
        </div>

        {% if task %}
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for s in ['pending', 'in_progress', 'completed', 'cancelled'] %}
                <option value="{{ s }}" {% if task.status == s %}selected{% endif %}>{{ s | replace('_', ' ') | title }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="location_id">Location</label>
            <select id="location_id" name="location_id">
                <option value="">-- No location --</option>
                {% for loc in locations %}
                <option value="{{ loc.id }}" {% if task and task.location_id == loc.id %}selected{% endif %}>{{ loc.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="assigned_to">Assign To</label>
            <select id="assigned_to" name="assigned_to">
                <option value="">-- Unassigned --</option>
                {% for s in staff %}
                <option value="{{ s.id }}" {% if task and task.assigned_to == s.id %}selected{% endif %}>{{ s.name }} ({{ s.role }})</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="2">{{ task.notes if task and task.notes else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ "Update Task" if task else "Create Task" }}</button>
        <a href="{{ url_for('task_list') }}" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
