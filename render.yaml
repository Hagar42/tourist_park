databases:
  - name: park-maintenance-db
    plan: free
    databaseName: park_maintenance

services:
  - type: web
    name: park-maintenance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: park-maintenance-db
          property: connectionString
    plan: free
